name: Flutter Build APK

# Menjalankan aksi ini setiap kali ada push ke branch 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repositori
      - uses: actions/checkout@v4

      # 2. Setup Java (diperlukan untuk build Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Sesuaikan dengan versi yang Anda gunakan
          channel: 'stable'

      # 4. Ambil dependensi (flutter pub get)
      - name: Install dependencies
        run: flutter pub get

      # 5. Jalankan proses Build APK
      - name: Build APK
        run: flutter build apk --release

      # 6. Simpan hasil compile sebagai Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          